<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>後台管理｜美淑琳設計顧問有限公司</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="admin.css">
<script src="admin.js" defer></script>
</head>
<body>
<div class="test-banner">系統測試中：目前為測試環境，資料僅供測試使用，尚未串接正式金流</div>
<div id="login-view" class="login-view">
 <form id="login-form" class="login-form">
  <h1>CTDC 後台管理</h1>
  <label>電子信箱<input type="email" name="email" required autocomplete="username"></label>
  <label>密碼<input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">登入</button>
  <p class="status" id="login-status" role="status"></p>
 </form>
</div>
<div id="app-view" class="app-view" hidden>
 <aside class="sidebar">
  <div class="sidebar-brand">CTDC 後台</div>
  <nav>
   <button type="button" data-view="dashboard" class="nav-btn active">總覽</button>
   <button type="button" data-view="orders" class="nav-btn">訂單管理</button>
   <button type="button" data-view="products" class="nav-btn" data-role="manager">商品管理</button>
   <button type="button" data-view="sales" class="nav-btn" data-role="manager">銷售分析</button>
   <button type="button" data-view="users" class="nav-btn" data-role="super_admin">帳號管理</button>
  </nav>
  <div class="sidebar-user">
   <span id="current-user"></span>
   <button type="button" id="logout-btn">登出</button>
  </div>
 </aside>
 <main>
  <section id="view-dashboard" class="view"></section>
  <section id="view-orders" class="view" hidden></section>
  <section id="view-products" class="view" hidden></section>
  <section id="view-sales" class="view" hidden></section>
  <section id="view-users" class="view" hidden></section>
 </main>
</div>
</body>
</html>
